<html lang="hu">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LaLiga 2026/27 – Eredménykövető</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f4f8;
    color: #172033;
}

header {
    background: linear-gradient(135deg, #071b42, #d90032);
    color: white;
    padding: 28px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    margin: 8px 0 0;
    opacity: .9;
}

.container {
    max-width: 1250px;
    margin: 25px auto;
    padding: 0 15px;
}

.controls {
    background: white;
    padding: 18px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

button,
select {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
    cursor: pointer;
}

button {
    background: #082052;
    color: white;
    font-weight: bold;
}

button:hover {
    opacity: .85;
}

select {
    background: #eef1f6;
}

.round-title {
    text-align: center;
    margin: 25px 0 15px;
}

.round-title h2 {
    margin-bottom: 5px;
}

.round-title p {
    color: #687386;
}

.matches {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 15px;
}

.match {
    background: white;
    border-radius: 16px;
    padding: 17px;
    box-shadow: 0 4px 15px rgba(0,0,0,.07);
    position: relative;
}

.match.played {
    border-left: 5px solid #159447;
}

.match.upcoming {
    border-left: 5px solid #b9c0ca;
}

.match-date {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-bottom: 12px;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    align-items: center;
    gap: 10px;
}

.team {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
}

.team.away {
    flex-direction: column;
}

.logo {
    width: 50px;
    height: 50px;
    object-fit: contain;
    margin-bottom: 8px;
}

.score {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
}

.vs {
    color: #999;
    font-size: 14px;
}

.status {
    text-align: center;
    margin-top: 12px;
    font-size: 12px;
    font-weight: bold;
}

.played .status {
    color: #159447;
}

.upcoming .status {
    color: #8a8f99;
}

.table-section {
    margin-top: 35px;
}

.table-section h2 {
    text-align: center;
}

.table-wrapper {
    overflow-x: auto;
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.07);
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    padding: 11px 8px;
    text-align: center;
    border-bottom: 1px solid #edf0f4;
}

th {
    background: #081f4c;
    color: white;
}

.team-cell {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    font-weight: bold;
}

.small-logo {
    width: 30px;
    height: 30px;
    object-fit: contain;
}

.position {
    font-weight: bold;
}

.champions {
    background: rgba(35, 100, 220, .08);
}

.europa {
    background: rgba(240, 180, 20, .10);
}

.relegation {
    background: rgba(220, 40, 40, .10);
}

footer {
    margin-top: 40px;
    padding: 25px;
    text-align: center;
    background: #08152f;
    color: white;
}

@media(max-width:600px) {
    header h1 {
        font-size: 25px;
    }

    .teams {
        grid-template-columns: 1fr 65px 1fr;
    }

    .logo {
        width: 42px;
        height: 42px;
    }
}
</style>
</head>

/* eredmények
   formátum:
   "forduló-index_meccs-index": [hazai gól, vendég gól]

   Példa:
   results["0_0"] = [2,1]
*/

const results = {};


/* =========================================================
   FORDULÓVÁLASZTÓ
========================================================= */

const roundSelect = document.getElementById("roundSelect");

rounds.forEach((round, index) => {

    const option = document.createElement("option");

    option.value = index;
    option.textContent =
        `${index + 1}. forduló – ${round.date}`;

    roundSelect.appendChild(option);

});


/* =========================================================
   CSAPATSZŰRŐ
========================================================= */

const teamFilter = document.getElementById("teamFilter");

Object.keys(teams)
    .sort((a,b) =>
        teams[a].name.localeCompare(teams[b].name)
    )
    .forEach(code => {

        const option = document.createElement("option");

        option.value = code;
        option.textContent = teams[code].name;

        teamFilter.appendChild(option);

    });


/* =========================================================
   FORDULÓ MEGJELENÍTÉSE
========================================================= */

function renderRound() {

    roundSelect.value = currentRound;

    const round = rounds[currentRound];

    document.getElementById("roundName").textContent =
        `${currentRound + 1}. forduló`;

    document.getElementById("roundDate").textContent =
        `Hivatalos forduló: ${round.date}`;

    const matches = document.getElementById("matches");

    matches.innerHTML = "";

    const filter = teamFilter.value;

    round.games.forEach((game, index) => {

        const home = game[0];
        const away = game[1];

        if (
            filter !== "all" &&
            home !== filter &&
            away !== filter
        ) {
            return;
        }

        const resultKey = `${currentRound}_${index}`;

        const hasResult =
            results[resultKey] !== undefined;

        const homeScore =
            hasResult ? results[resultKey][0] : "-";

        const awayScore =
            hasResult ? results[resultKey][1] : "-";

        const card = document.createElement("div");

        card.className =
            "match " +
            (hasResult ? "played" : "upcoming");

        card.innerHTML = `

            <div class="match-date">
                ${round.date}
            </div>

            <div class="teams">

                <div class="team">
                    <img
                        class="logo"
                        src="${teams[home].logo}"
                        alt="${teams[home].name}"
                    >

                    <span>
                        ${teams[home].name}
                    </span>
                </div>

                <div class="score">

                    ${
                        hasResult
                        ? `<strong>${homeScore} - ${awayScore}</strong>`
                        : `<span class="vs">VS</span>`
                    }

                </div>

                <div class="team away">

                    <img
                        class="logo"
                        src="${teams[away].logo}"
                        alt="${teams[away].name}"
                    >

                    <span>
                        ${teams[away].name}
                    </span>

                </div>

            </div>

            <div class="status">

                ${
                    hasResult
                    ? "✓ LEJÁTSZVA"
                    : "○ MÉG NEM JÁTSZOTTÁK LE"
                }

            </div>

        `;

        matches.appendChild(card);

    });

    renderStandings();
}


/* =========================================================
   TABELLÁHOZ ADATOK
========================================================= */

function createTable() {

    const table = {};

    Object.keys(teams).forEach(code => {

        table[code] = {

            team: code,
            played: 0,
            wins: 0,
            draws: 0,
            losses: 0,
            gf: 0,
            ga: 0,
            points: 0

        };

    });

    return table;
}


/* =========================================================
   TABELLA
========================================================= */

function renderStandings() {

    const table = createTable();

    rounds.forEach((round, rIndex) => {

        round.games.forEach((game, gIndex) => {

            const key = `${rIndex}_${gIndex}`;

            if (!results[key]) return;

            const home = game[0];
            const away = game[1];

            const hg = results[key][0];
            const ag = results[key][1];

            table[home].played++;
            table[away].played++;

            table[home].gf += hg;
            table[home].ga += ag;

            table[away].gf += ag;
            table[away].ga += hg;

            if (hg > ag) {

                table[home].wins++;
                table[home].points += 3;

                table[away].losses++;

            }
            else if (hg < ag) {

                table[away].wins++;
                table[away].points += 3;

                table[home].losses++;

            }
            else {

                table[home].draws++;
                table[away].draws++;

                table[home].points++;
                table[away].points++;

            }

        });

    });


    const sorted = Object.values(table).sort((a,b) => {

        const points =
            b.points - a.points;

        if (points !== 0)
            return points;

        const gd =
            (b.gf - b.ga) -
            (a.gf - a.ga);

        if (gd !== 0)
            return gd;

        return b.gf - a.gf;

    });


    const tbody =
        document.getElementById("standings");

    tbody.innerHTML = "";


    sorted.forEach((team, index) => {

        const position = index + 1;

        let rowClass = "";

        if (position <= 4)
            rowClass = "champions";

        else if (position <= 6)
            rowClass = "europa";

        else if (position >= 18)
            rowClass = "relegation";


        const row =
            document.createElement("tr");

        row.className = rowClass;


        row.innerHTML = `

            <td class="position">
                ${position}
            </td>

            <td>

                <div class="team-cell">

                    <img
                        class="small-logo"
                        src="${teams[team.team].logo}"
                    >

                    ${teams[team.team].name}

                </div>

            </td>

            <td>${team.played}</td>
            <td>${team.wins}</td>
            <td>${team.draws}</td>
            <td>${team.losses}</td>
            <td>${team.gf}</td>
            <td>${team.ga}</td>
            <td>${team.gf - team.ga > 0 ? "+" : ""}${team.gf - team.ga}</td>
            <td><strong>${team.points}</strong></td>

        `;

        tbody.appendChild(row);

    });

}


/* =========================================================
   NAVIGÁCIÓ
========================================================= */

function previousRound() {

    if (currentRound > 0) {

        currentRound--;

        renderRound();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}


function nextRound() {

    if (currentRound < rounds.length - 1) {

        currentRound++;

        renderRound();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}


function changeRound() {

    currentRound =
        Number(roundSelect.value);

    renderRound();

}


/* =========================================================
   INDÍTÁS
========================================================= */

renderRound();

</script>
